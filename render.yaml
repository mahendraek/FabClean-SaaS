services:
  - type: web
    name: fabclean-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --no-access-log
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://fabclean-saas-web.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "8"
    healthCheckPath: /api/health

  - type: web
    name: fabclean-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://fabclean-saas-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
