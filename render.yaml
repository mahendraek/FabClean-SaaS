services:
  - type: web
    name: fabclean-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

  - type: web
    name: fabclean-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://fabclean-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
