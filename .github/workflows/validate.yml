name: PR validation
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'roadmap/**']
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FABCLEAN_TEST_DATABASE_URL: postgresql://fabclean_test:local-ci-only@127.0.0.1:5432/fabclean_test
      # The validation script changes XDG_CACHE_HOME; browser install and launch
      # must therefore use an explicit shared directory throughout the job.
      PLAYWRIGHT_BROWSERS_PATH: /tmp/fabclean-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Prepare non-bypass test database owner
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres',autocommit=True) as conn:
              conn.execute("CREATE ROLE fabclean_test LOGIN PASSWORD 'local-ci-only' NOSUPERUSER NOBYPASSRLS")
              conn.execute('CREATE DATABASE fabclean_test OWNER fabclean_test')
          PY
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify installed Chromium starts
        working-directory: frontend
        run: |
          XDG_CACHE_HOME="${XDG_CACHE_HOME:-/tmp/fabclean-cache}" node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            console.log('Installed Chromium starts:', browser.version());
            await browser.close();
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Backend, PostgreSQL RLS, load, frontend and browser validation
        run: scripts/validate.sh
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            /tmp/pr6-validation-load.json
            /tmp/handoffs-*.png
          if-no-files-found: ignore
